name: Mirror to Personal Repo

on:
  push:
    branches:
      - '**' # Matches pushes to every single branch

jobs:
  git-mirror:
    runs-on: ubuntu-latest
    if: github.repository == 'fortsolar/fortsolar-admin-webapp-frontend'
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Re-author and Mirror Push
        run: |
          # 1. Configure your personal profile on the fly
          git config --global user.name "fort-solar"
          git config --global user.email "fortsolarx@gmail.com"
          
          # 2. Re-sign the top commit as you to satisfy Vercel
          git commit --amend --no-edit --author="fort-solar <fortsolarx@gmail.com>"
          
          # 3. Always mirror all branches to your main clone repo
          MAIN_CLONE_URL="https://${{ secrets.PERSONAL_REPO_TOKEN }}@github.com/fort-solar/fortsolar-admin-webapp-frontend-clone.git"
          git push --force "$MAIN_CLONE_URL" HEAD:refs/heads/${{ github.ref_name }}
          
          # 4. Additionally mirror the staging branch to your dedicated staging clone repo
          if [ "${{ github.ref_name }}" = "staging" ]; then
            STAGING_CLONE_URL="https://${{ secrets.PERSONAL_REPO_TOKEN }}@github.com/fort-solar/staging-admin-webapp-clone.git"
            git push --force "$STAGING_CLONE_URL" HEAD:refs/heads/main HEAD:refs/heads/staging
          fi



